<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Configurar examen</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div id="configurador">

    <h1>⚙️ Configurar examen</h1>


    <!-- ========================================
         MATERIA
         ======================================== -->

    <p>Materia:</p>

    <input
        type="text"
        id="materia"
        placeholder="Ej: Historia"
    >


    <!-- ========================================
         PREGUNTAS DISPONIBLES
         ======================================== -->

    <p>
        Cantidad total de preguntas disponibles:
    </p>

    <input
        type="number"
        id="cantidadPreguntas"
        min="1"
        max="50"
        value="5"
    >


    <!-- ========================================
         PREGUNTAS POR ALUMNO
         ======================================== -->

    <p>
        Cantidad de preguntas por alumno:
    </p>

    <input
        type="number"
        id="preguntasPorAlumno"
        min="1"
        max="50"
        value="2"
    >


    <!-- ========================================
         CONTENEDOR DE PREGUNTAS
         ======================================== -->

    <h2>Preguntas</h2>

    <div id="preguntas"></div>


    <br>


    <!-- ========================================
         BOTÓN CREAR PREGUNTAS
         ======================================== -->

    <button
        type="button"
        onclick="generarPreguntas()"
    >
        Crear preguntas
    </button>


    <br>
    <br>


    <!-- ========================================
         BOTÓN CREAR EXAMEN
         ======================================== -->

    <button
        type="button"
        id="botonCrear"
        onclick="crearExamen()"
    >
        Generar examen
    </button>


    <!-- ========================================
         RESULTADO DE CREACIÓN
         ======================================== -->

    <div id="resultadoCreacion"></div>


</div>



<script>


// ========================================
// URL DE GOOGLE APPS SCRIPT
// ========================================

const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbync4Zy8sk82iujKYKrwsBfI4S0j3u6houResIimu9QIY_UPiKeUlTVgVzfANB4vko6/exec";



// ========================================
// GENERAR PREGUNTAS
// ========================================

function generarPreguntas() {


    const cantidad =
        Number(
            document
                .getElementById(
                    "cantidadPreguntas"
                )
                .value
        );


    const porAlumno =
        Number(
            document
                .getElementById(
                    "preguntasPorAlumno"
                )
                .value
        );


    // ========================================
    // VALIDAR CANTIDADES
    // ========================================

    if (
        !Number.isInteger(cantidad) ||
        cantidad < 1 ||
        cantidad > 50
    ) {

        alert(
            "La cantidad disponible debe estar entre 1 y 50."
        );

        return;

    }


    if (
        !Number.isInteger(porAlumno) ||
        porAlumno < 1 ||
        porAlumno > cantidad
    ) {

        alert(
            "La cantidad por alumno debe ser al menos 1 y no superar las preguntas disponibles."
        );

        return;

    }


    // ========================================
    // CONTENEDOR
    // ========================================

    const contenedor =
        document.getElementById(
            "preguntas"
        );


    contenedor.innerHTML = "";


    // ========================================
    // CREAR CADA PREGUNTA
    // ========================================

    for (
        let i = 0;
        i < cantidad;
        i++
    ) {


        const bloque =
            document.createElement(
                "div"
            );


        bloque.className =
            "pregunta";


        bloque.innerHTML = `

            <hr>

            <h3>
                Pregunta ${i + 1}
            </h3>


            <p>
                Enunciado:
            </p>

            <input
                type="text"
                class="enunciado"
                placeholder="Escribí la pregunta"
            >


            <p>
                Respuesta 1:
            </p>

            <input
                type="text"
                class="opcion"
                placeholder="Escribí la respuesta"
            >


            <p>
                Respuesta 2:
            </p>

            <input
                type="text"
                class="opcion"
                placeholder="Escribí la respuesta"
            >


            <p>
                Respuesta 3:
            </p>

            <input
                type="text"
                class="opcion"
                placeholder="Escribí la respuesta"
            >


            <p>
                Respuesta 4:
            </p>

            <input
                type="text"
                class="opcion"
                placeholder="Escribí la respuesta"
            >


            <p>
                Respuesta correcta:
            </p>

            <select class="correcta">

                <option value="0">
                    Respuesta 1
                </option>

                <option value="1">
                    Respuesta 2
                </option>

                <option value="2">
                    Respuesta 3
                </option>

                <option value="3">
                    Respuesta 4
                </option>

            </select>

            <br>
            <br>

        `;


        contenedor.appendChild(
            bloque
        );

    }

}



// ========================================
// GENERAR ID ÚNICO
// ========================================

function generarID() {

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .substring(2, 8)
    );

}



// ========================================
// CREAR EXAMEN
// ========================================

async function crearExamen() {


    const materia =
        document
            .getElementById(
                "materia"
            )
            .value
            .trim();


    const cantidad =
        Number(
            document
                .getElementById(
                    "cantidadPreguntas"
                )
                .value
        );


    const preguntasPorAlumno =
        Number(
            document
                .getElementById(
                    "preguntasPorAlumno"
                )
                .value
        );


    const bloques =
        document.querySelectorAll(
            ".pregunta"
        );


    // ========================================
    // VALIDAR MATERIA
    // ========================================

    if (!materia) {

        alert(
            "Escribí el nombre de la materia."
        );

        return;

    }


    // ========================================
    // VALIDAR CANTIDAD DISPONIBLE
    // ========================================

    if (
        !Number.isInteger(cantidad) ||
        cantidad < 1 ||
        cantidad > 50
    ) {

        alert(
            "La cantidad disponible debe estar entre 1 y 50."
        );

        return;

    }


    // ========================================
    // VALIDAR CANTIDAD POR ALUMNO
    // ========================================

    if (
        !Number.isInteger(
            preguntasPorAlumno
        ) ||
        preguntasPorAlumno < 1 ||
        preguntasPorAlumno > cantidad
    ) {

        alert(
            "La cantidad por alumno debe estar entre 1 y la cantidad disponible."
        );

        return;

    }


    // ========================================
    // COMPROBAR QUE SE CREARON
    // TODAS LAS PREGUNTAS
    // ========================================

    if (
        bloques.length !== cantidad
    ) {

        alert(
            "Primero apretá «Crear preguntas»."
        );

        return;

    }


    // ========================================
    // CREAR ARRAY DE PREGUNTAS
    // ========================================

    const preguntas = [];

    let errorValidacion = "";


    bloques.forEach(
        (
            bloque,
            indice
        ) => {


            const enunciado =
                bloque
                    .querySelector(
                        ".enunciado"
                    )
                    .value
                    .trim();


            const camposOpciones =
                [
                    ...bloque.querySelectorAll(
                        ".opcion"
                    )
                ];


            const opciones =
                camposOpciones.map(
                    campo =>
                        campo.value.trim()
                );


            const correcta =
                Number(
                    bloque
                        .querySelector(
                            ".correcta"
                        )
                        .value
                );


            // ========================================
            // VALIDAR ENUNCIADO
            // ========================================

            if (!enunciado) {

                errorValidacion =
                    `Falta el enunciado de la pregunta ${indice + 1}.`;

                return;

            }


            // ========================================
            // VALIDAR RESPUESTAS
            // ========================================

            if (
                opciones.some(
                    opcion =>
                        !opcion
                )
            ) {

                errorValidacion =
                    `Completá las cuatro respuestas de la pregunta ${indice + 1}.`;

                return;

            }


            // ========================================
            // GUARDAR PREGUNTA
            // ========================================

            preguntas.push({

                pregunta:
                    enunciado,

                opciones:
                    opciones,

                correcta:
                    correcta

            });

        }
    );


    // ========================================
    // MOSTRAR ERROR
    // ========================================

    if (errorValidacion) {

        alert(
            errorValidacion
        );

        return;

    }


    // ========================================
    // CREAR EXAMEN
    // ========================================

    const examen = {

        id:
            generarID(),

        materia:
            materia,

        preguntasPorAlumno:
            preguntasPorAlumno,

        cantidadPreguntas:
            cantidad,

        preguntas:
            preguntas

    };


    console.log(
        "Examen que se enviará:",
        examen
    );


    // ========================================
    // BOTÓN
    // ========================================

    const boton =
        document.getElementById(
            "botonCrear"
        );


    const resultadoDiv =
        document.getElementById(
            "resultadoCreacion"
        );


    boton.disabled =
        true;


    boton.textContent =
        "Guardando...";


    resultadoDiv.innerHTML =
        "";


    // ========================================
    // ENVIAR A APPS SCRIPT
    // ========================================

    try {


        const respuesta =
            await fetch(
                URL_APPS_SCRIPT,
                {

                    method:
                        "POST",

                    body:
                        JSON.stringify({

                            accion:
                                "crearExamen",

                            id:
                                examen.id,

                            materia:
                                examen.materia,

                            preguntasPorAlumno:
                                examen.preguntasPorAlumno,

                            cantidadPreguntas:
                                examen.cantidadPreguntas,

                            preguntas:
                                examen.preguntas

                        })

                }
            );


        const resultado =
            await respuesta.json();


        console.log(
            "Respuesta de Apps Script:",
            resultado
        );


        // ========================================
        // ERROR
        // ========================================

        if (
            !respuesta.ok ||
            !resultado.ok
        ) {

            throw new Error(
                resultado.error ||
                "No se pudo guardar el examen."
            );

        }


        // ========================================
        // CREAR ENLACE DEL ALUMNO
        // ========================================

        const enlaceAlumno =
            window.location.href.substring(
                0,
                window.location.href.lastIndexOf(
                    "/"
                ) + 1
            ) +
            "index.html?id=" +
            encodeURIComponent(
                examen.id
            );


        // ========================================
        // MOSTRAR RESULTADO
        // ========================================

        resultadoDiv.innerHTML = "";


        const titulo =
            document.createElement(
                "h2"
            );


        titulo.textContent =
            "🎉 ¡Examen creado correctamente!";


        const informacion =
            document.createElement(
                "p"
            );


        informacion.innerHTML =

            "<strong>Materia:</strong> " +
            examen.materia +

            "<br>" +

            "<strong>Preguntas disponibles:</strong> " +
            examen.cantidadPreguntas +

            "<br>" +

            "<strong>Preguntas por alumno:</strong> " +
            examen.preguntasPorAlumno +

            "<br>" +

            "<strong>ID:</strong> " +
            examen.id;


        // ========================================
        // ENLACE ALUMNO
        // ========================================

        const tituloAlumno =
            document.createElement(
                "p"
            );


        tituloAlumno.innerHTML =
            "<strong>🔗 Enlace para los alumnos:</strong>";


        const enlace =
            document.createElement(
                "a"
            );


        enlace.href =
            enlaceAlumno;

        enlace.textContent =
            "Abrir examen";

        enlace.target =
            "_blank";

        enlace.rel =
            "noopener noreferrer";


        // ========================================
        // BOTÓN COPIAR
        // ========================================

        const botonCopiar =
            document.createElement(
                "button"
            );


        botonCopiar.type =
            "button";


        botonCopiar.textContent =
            "📋 Copiar enlace";


        botonCopiar.onclick =
            async function () {


                try {

                    await navigator.clipboard.writeText(
                        enlaceAlumno
                    );

                    alert(
                        "¡Enlace copiado!"
                    );

                } catch (error) {

                    prompt(
                        "Copiá este enlace:",
                        enlaceAlumno
                    );

                }

            };


        // ========================================
        // ENLACE RESULTADOS
        // ========================================

        const tituloResultados =
            document.createElement(
                "p"
            );


        tituloResultados.innerHTML =
            "<strong>📊 Resultados:</strong>";


        const enlaceResultados =
            document.createElement(
                "a"
            );


        enlaceResultados.href =
            resultado.urlResultados;

        enlaceResultados.textContent =
            "Abrir resultados";

        enlaceResultados.target =
            "_blank";

        enlaceResultados.rel =
            "noopener noreferrer";


        // ========================================
        // MOSTRAR TODO
        // ========================================

        resultadoDiv.append(

            titulo,

            informacion,

            tituloAlumno,

            enlace,

            document.createElement(
                "br"
            ),

            botonCopiar,

            document.createElement(
                "br"
            ),

            document.createElement(
                "br"
            ),

            tituloResultados,

            enlaceResultados

        );


    } catch (error) {


        console.error(
            "Error:",
            error
        );


        alert(
            "No se pudo crear el examen.\n\n" +
            error.message
        );


    } finally {


        boton.disabled =
            false;


        boton.textContent =
            "Generar examen";

    }

}

</script>


</body>

</html>
