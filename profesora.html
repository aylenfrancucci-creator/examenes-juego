<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Configurar examen</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="configurador">

    <h1>⚙️ Configurar examen</h1>

    <p>Materia:</p>

    <input
        type="text"
        id="materia"
        placeholder="Ej: Historia"
    >


    <p>Preguntas disponibles:</p>

    <input
        type="number"
        id="cantidadPreguntas"
        min="1"
        max="50"
        value="10"
    >

    <p>Preguntas por alumno:</p>

    <input
        type="number"
        id="preguntasPorAlumno"
        min="1"
        value="5"
    >


    <h2>Preguntas</h2>

    <div id="preguntas"></div>

    <br>

    <button
        type="button"
        onclick="generarPreguntas()"
    >
        Crear preguntas
    </button>

    <br>
    <br>

    <button
        type="button"
        onclick="crearExamen()"
    >
        Generar examen
    </button>

</div>


<script>

    // ========================================
    // URL DE GOOGLE APPS SCRIPT
    // ========================================

    const URL_APPS_SCRIPT =
        "https://script.google.com/macros/s/AKfycbxRunM6BUjUQNyg1rXFrJqUtvToarADE1JDu-cmhae_ljq07cfCYOB737EmjrgWnyLT/exec";


    // ========================================
    // CREAR PREGUNTAS
    // ========================================

    function generarPreguntas() {

        const cantidad =
            Number(
                document
                    .getElementById("cantidadPreguntas")
                    .value
            );


        if (
            !Number.isInteger(cantidad) ||
            cantidad < 1 ||
            cantidad > 50
        ) {

            alert(
                "La cantidad de preguntas disponibles debe estar entre 1 y 50."
            );

            return;
        }


        const preguntasPorAlumno =
            Number(
                document
                    .getElementById("preguntasPorAlumno")
                    .value
            );


        if (
            !Number.isInteger(preguntasPorAlumno) ||
            preguntasPorAlumno < 1
        ) {

            alert(
                "La cantidad de preguntas por alumno debe ser válida."
            );

            return;
        }


        if (preguntasPorAlumno > cantidad) {

            alert(
                "No puede haber más preguntas por alumno que preguntas disponibles."
            );

            return;
        }


        const contenedor =
            document.getElementById("preguntas");


        contenedor.innerHTML = "";


        for (let i = 0; i < cantidad; i++) {

            const bloque =
                document.createElement("div");


            bloque.className = "pregunta";


            bloque.innerHTML = `

                <hr>

                <h3>Pregunta ${i + 1}</h3>

                <p>Pregunta:</p>

                <input
                    type="text"
                    placeholder="Escribí la pregunta"
                >

                <p>Respuesta 1:</p>

                <input
                    type="text"
                    placeholder="Respuesta"
                >

                <p>Respuesta 2:</p>

                <input
                    type="text"
                    placeholder="Respuesta"
                >

                <p>Respuesta 3:</p>

                <input
                    type="text"
                    placeholder="Respuesta"
                >

                <p>Respuesta 4:</p>

                <input
                    type="text"
                    placeholder="Respuesta"
                >

                <p>Respuesta correcta:</p>

                <select>

                    <option value="0">
                        Respuesta 1
                    </option>

                    <option value="1">
                        Respuesta 2
                    </option>

                    <option value="2">
                        Respuesta 3
                    </option>

                    <option value="3">
                        Respuesta 4
                    </option>

                </select>

                <br>
                <br>

            `;


            contenedor.appendChild(bloque);

        }

    }


    // ========================================
    // CREAR ID ÚNICO
    // ========================================

    function generarID() {

        return (
            Date.now().toString(36) +
            Math.random()
                .toString(36)
                .substring(2, 8)
        );

    }


    // ========================================
    // GENERAR EXAMEN
    // ========================================

    async function crearExamen() {

        const materia =
            document
                .getElementById("materia")
                .value
                .trim();


        const cantidad =
            Number(
                document
                    .getElementById("cantidadPreguntas")
                    .value
            );


        const preguntasPorAlumno =
            Number(
                document
                    .getElementById("preguntasPorAlumno")
                    .value
            );


        if (materia === "") {

            alert(
                "Escribí el nombre de la materia."
            );

            return;

        }


        if (
            !Number.isInteger(cantidad) ||
            cantidad < 1 ||
            cantidad > 50
        ) {

            alert(
                "La cantidad de preguntas disponibles debe estar entre 1 y 50."
            );

            return;

        }


        if (
            !Number.isInteger(preguntasPorAlumno) ||
            preguntasPorAlumno < 1
        ) {

            alert(
                "La cantidad de preguntas por alumno debe ser válida."
            );

            return;

        }


        if (preguntasPorAlumno > cantidad) {

            alert(
                "No puede haber más preguntas por alumno que preguntas disponibles."
            );

            return;

        }


        const bloques =
            document.querySelectorAll(
                ".pregunta"
            );


        if (bloques.length !== cantidad) {

            alert(
                "Primero apretá 'Crear preguntas' para generar todas las preguntas."
            );

            return;

        }


        const preguntas = [];


        bloques.forEach((bloque) => {

            const campos =
                bloque.querySelectorAll("input");


            const pregunta =
                campos[0]
                    .value
                    .trim();


            const opciones = [

                campos[1]
                    .value
                    .trim(),

                campos[2]
                    .value
                    .trim(),

                campos[3]
                    .value
                    .trim(),

                campos[4]
                    .value
                    .trim()

            ];


            const correcta =
                Number(
                    bloque
                        .querySelector("select")
                        .value
                );


            preguntas.push({

                pregunta: pregunta,

                opciones: opciones,

                correcta: correcta

            });

        });


        // ========================================
        // CREAR NUEVO EXAMEN
        // ========================================

        const examen = {

            id: generarID(),

            materia: materia,

            cantidadPreguntas: cantidad,

            preguntasPorAlumno: preguntasPorAlumno,

            preguntas: preguntas

        };


        console.log(
            "Enviando examen:",
            examen
        );


        // ========================================
        // ENVIAR A GOOGLE APPS SCRIPT
        // ========================================

        try {

            const respuesta =
                await fetch(
                    URL_APPS_SCRIPT,
                    {
                        method: "POST",

                        body: JSON.stringify(examen)
                    }
                );


            const resultado =
                await respuesta.json();


            console.log(
                "Respuesta de Apps Script:",
                resultado
            );


            if (resultado.ok) {

                alert(
                    "¡Examen creado correctamente!\n\n" +
                    "Materia: " +
                    examen.materia +
                    "\nPreguntas disponibles: " +
                    examen.cantidadPreguntas +
                    "\nPreguntas por alumno: " +
                    examen.preguntasPorAlumno +
                    "\nID: " +
                    examen.id
                );

            } else {

                alert(
                    "Hubo un problema al guardar el examen."
                );

            }


        } catch (error) {

            console.error(
                "Error:",
                error
            );


            alert(
                "No se pudo conectar con el servidor."
            );

        }

    }

</script>

</body>

</html>
